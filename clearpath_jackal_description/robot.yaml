serial_number: j100-0897
version: 0
system:
  username: robot
  hosts:
    - hostname: cpr-j100-0897
      ip: 192.168.131.1
  ros2:
    namespace: j100_0897
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
    workspaces: []

platform:
  attachments:
    - name: front_fender
      type: j100.fender
      model: sensor
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      enabled: true
    - name: rear_fender
      type: j100.fender
      model: sensor
      parent: base_link
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 3.1415]
      enabled: true
  mcu:
    protocol: proton

  drivetrain:
    control: diff_4wd
    wheels:
      front: outdoor
      rear: outdoor
