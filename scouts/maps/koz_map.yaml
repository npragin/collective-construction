# koz_map.png is 225px x 200px
# real world is 11m x 7m
# 225 * x = 11, x =  0.05

# # Pioneer
image: koz_map.png
resolution: 0.05        # meters per pixel
origin: [0.0, 0.0, 0.0] # real-world coords of bottom-left corner
negate: 0               # 0 = white is free, black is wall
occupied_thresh: 0.65
free_thresh: 0.25

