# Global (world-frame) EKF for BEV-fused localization.
#
# This is the second robot_localization instance. The robot's existing local EKF
# (clearpath_jackal_description/platform/config/localization.yaml) keeps
# publishing odom -> base_link by fusing wheel odometry + IMU. This one adds the
# global correction by fusing the same wheel-odometry velocities and IMU with an
# absolute pose derived from the overhead BEV camera (published by
# bev_pose_bridge on `bev_pose`), and it publishes world -> odom. Together the
# two give a single connected tree: world -> odom -> base_link.
/**:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    # world_frame == map_frame -> this node owns the world -> odom transform.
    map_frame: world
    odom_frame: odom
    base_link_frame: base_link
    world_frame: world

    # Wheel odometry: fuse velocities only (vx, vy, vyaw). Absolute x/y are left
    # to the BEV pose so wheel drift never fights the camera.
    odom0: platform/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # IMUs: yaw rate only. Do NOT fuse linear acceleration here -- with no fast
    # absolute position source (camera is ~1.3 Hz), accel bias double-integrates
    # and the filter diverges.
    imu0: sensors/imu_0/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    imu1: sensors/imu_1/data
    imu1_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu1_differential: false
    imu1_queue_size: 10
    imu1_remove_gravitational_acceleration: true

    # Overhead BEV camera pose (base_link in world): absolute x, y, yaw.
    pose0: bev_pose
    pose0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
